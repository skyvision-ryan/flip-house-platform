# Render Blueprint：在 render.com 选 New → Blueprint → 选这个仓库 → Apply 即可。
# 之后每次推送到 main 自动重新部署。
services:
  - type: web
    name: flip-house-platform-ryan
    runtime: docker
    repo: https://github.com/skyvision-ryan/flip-house-platform
    branch: main
    region: oregon
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PROVIDER
        value: mock
      - key: DATA_DIR
        value: /app/backend/data
