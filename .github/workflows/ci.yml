name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests
        env:
          DATA_DIR: ${{ runner.temp }}/flip-house-data
          DEMO_MODE: "1"
          SEED_DEMO: "0"
        working-directory: backend
        run: python -m unittest discover -s tests

      # 报告服务是独立服务，依赖和测试入口都是自己的一套
      - name: Install VP report service dependencies
        run: python -m pip install -r services/vp_report/requirements.txt

      - name: VP report service tests
        working-directory: services/vp_report
        run: python -m unittest discover -s tests

      - name: Claude guard tests
        run: python .claude/hooks/test_check_commit.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build
